<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xterm.js Tauri Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #1e1e1e;
      }
      #terminal {
        width: 100%;
        height: 100%;
      }
      .xterm {
        padding: 8px;
      }
      /* 加载状态 */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1e1e1e;
        color: #d4d4d4;
        z-index: 100;
        transition: opacity 0.3s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #333;
        border-top-color: #0dbc79;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #loading p {
        margin-top: 16px;
        font-size: 14px;
        color: #888;
      }
      /* 快捷工具栏 */
      #toolbar {
        position: fixed;
        bottom: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
        z-index: 50;
      }
      .toolbar-btn {
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: #d4d4d4;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .toolbar-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .toolbar-btn:active {
        transform: scale(0.95);
      }
      /* 状态栏 */
      #status-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 6px 12px;
        background: rgba(30, 30, 30, 0.95);
        border-top: 1px solid #333;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #888;
        z-index: 40;
      }
      #status-bar .left {
        display: flex;
        gap: 16px;
      }
      #status-bar .right {
        display: flex;
        gap: 16px;
      }
      #status-bar span {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #status-bar .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #0dbc79;
      }
      #status-bar .dot.error {
        background: #f14c4c;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p>初始化终端...</p>
    </div>
    <div id="terminal"></div>
    <div id="toolbar">
      <button class="toolbar-btn" id="btn-clear" title="清屏">清屏</button>
      <button class="toolbar-btn" id="btn-font-increase" title="放大字体">A+</button>
      <button class="toolbar-btn" id="btn-font-decrease" title="缩小字体">A-</button>
      <button class="toolbar-btn" id="btn-theme" title="切换主题">主题</button>
      <button class="toolbar-btn" id="btn-copy" title="复制选中内容">复制</button>
    </div>
    <div id="status-bar">
      <div class="left">
        <span><span class="dot" id="status-dot"></span> <span id="status-text">就绪</span></span>
        <span>尺寸: <span id="size-text">--</span></span>
      </div>
      <div class="right">
        <span>字体: <span id="font-size-text">14px</span></span>
        <span>主题: <span id="theme-text">dark</span></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
